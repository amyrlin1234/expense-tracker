<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(to bottom right, #f1f5f9, #e2e8f0);
      min-height: 100vh;
      padding: 0;
    }
    
    .header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 24px 16px;
      margin-bottom: 24px;
    }
    
    .header h1 {
      font-size: 28px;
      color: #0f172a;
      margin-bottom: 4px;
    }
    
    .header p {
      color: #64748b;
      font-size: 14px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }
    
    .tabs {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    
    .tab-btn {
      padding: 12px 16px;
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 500;
      color: #64748b;
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    
    .tab-btn.active {
      color: #0f172a;
      border-bottom-color: #0f172a;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 16px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #0f172a;
      margin-bottom: 8px;
    }
    
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .upload-btn {
      width: 100%;
      background: linear-gradient(to right, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 16px;
      text-align: center;
    }
    
    .upload-btn:hover {
      background: linear-gradient(to right, #2563eb, #1d4ed8);
    }
    
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background: #0f172a;
      color: white;
    }
    
    .btn-primary:hover {
      background: #1e293b;
    }
    
    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    
    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-type {
      background: #e2e8f0;
      color: #64748b;
      padding: 10px 16px;
      border: 2px solid transparent;
    }

    .btn-type.active {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }
    
    .btn-danger {
      background: none;
      color: #ef4444;
      padding: 4px;
      border-radius: 4px;
    }
    
    .btn-danger:hover {
      background: #fee2e2;
    }
    
    .btn-edit {
      background: none;
      color: #64748b;
      padding: 4px;
      border-radius: 4px;
    }
    
    .btn-edit:hover {
      color: #0f172a;
    }
    
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    
    .table th {
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #0f172a;
    }
    
    .table td {
      border-bottom: 1px solid #e2e8f0;
      padding: 12px;
      color: #475569;
    }
    
    .table tr:hover {
      background: #f8fafc;
    }
    
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .summary-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    
    .summary-label {
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    .summary-value {
      font-size: 24px;
      font-weight: bold;
      color: #0f172a;
    }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      animation: slideUp 0.3s ease;
      z-index: 1000;
    }
    
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    #fileInput {
      display: none;
    }

    @media (max-width: 600px) {
      .summary {
        grid-template-columns: 1fr;
      }
      
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .table {
        font-size: 12px;
      }
      
      .table th, .table td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Expense Tracker</h1>
    <p>Track your monthly spending</p>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('view')">View (0)</button>
      <button class="tab-btn" onclick="switchTab('add')">➕ New Entry</button>
      <button class="tab-btn" onclick="switchTab('transfer')">↔️ Transfer</button>
      <button class="tab-btn" onclick="switchTab('categories')">Categories</button>
    </div>

    <!-- View Tab -->
    <div id="view" class="tab-content active">
      <div id="summary" class="summary" style="display: none;"></div>
      <div id="table-container"></div>
      <div id="empty-view" class="card empty-state">
        <div class="empty-state-icon">📊</div>
        <p>No expenses yet</p>
        <button class="btn btn-primary" onclick="switchTab('add')" style="margin-top: 12px;">Add First Expense</button>
      </div>
    </div>

    <!-- Add Tab -->
    <div id="add" class="tab-content">
      <div class="card">
        <form id="expenseForm" onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label>Type</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <button type="button" class="btn btn-type active" data-type="expense" onclick="setType('expense')">💸 Expense</button>
              <button type="button" class="btn btn-type" data-type="income" onclick="setType('income')">💰 Income</button>
            </div>
            <input type="hidden" id="entryType" value="expense">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="date" required>
            </div>
            <div class="form-group">
              <label>Amount</label>
              <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" required>
            </div>
          </div>

          <div class="form-group">
            <label>Store Name</label>
            <input type="text" id="store" placeholder="e.g., S&R, Puregold, Jollibee" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Category</label>
              <select id="category" required>
                <option value="groceries">🛒 Groceries</option>
                <option value="transport">🚗 Transport</option>
                <option value="dining">🍽️ Dining</option>
                <option value="shopping">🛍️ Shopping</option>
                <option value="utilities">💡 Utilities</option>
                <option value="entertainment">🎬 Entertainment</option>
                <option value="health">💊 Health</option>
                <option value="salary">💼 Salary</option>
                <option value="bonus">🎁 Bonus/Gift</option>
                <option value="other" selected>📝 Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Payment Method</label>
              <select id="payment" required>
                <option value="gcash">Gcash</option>
                <option value="miles-plus">Miles+</option>
                <option value="bdo">BDO</option>
                <option value="chinabank">Chinabank</option>
                <option value="paul-miles-plus">Paul Miles+</option>
                <option value="paul-reserve">Paul Reserve</option>
                <option value="shell">Shell</option>
                <option value="rewards">Rewards</option>
                <option value="cashback-mc">Cashback MC</option>
                <option value="mastercard">Mastercard</option>
                <option value="unionbank">Unionbank</option>
                <option value="bpi">BPI</option>
                <option value="cash">Cash</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Remarks (Optional)</label>
            <textarea id="remarks" rows="3" placeholder="Add any notes..."></textarea>
          </div>

          <div class="form-group">
            <label>
              <input type="checkbox" id="splitEntry" onchange="toggleSplit()"> Split across multiple categories
            </label>
          </div>

          <div id="splitContainer" style="display: none; border-top: 1px solid #e2e8f0; padding-top: 16px; margin-top: 16px;">
            <p style="font-size: 12px; color: #64748b; margin-bottom: 12px;">Add category splits (must total 100%)</p>
            <div id="splitsList"></div>
            <button type="button" class="btn btn-secondary" onclick="addSplit()" style="width: 100%; margin-top: 8px;">+ Add Split</button>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn btn-primary">Add Expense</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm(); switchTab('view');">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Transfer Tab -->
    <div id="transfer" class="tab-content">
      <div class="card">
        <h2 style="margin-bottom: 16px;">Transfer Between Accounts</h2>
        <form onsubmit="handleTransfer(event)">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="transferDate" required>
          </div>

          <div class="form-group">
            <label>Amount</label>
            <input type="number" id="transferAmount" placeholder="0.00" step="0.01" min="0" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>From Account</label>
              <select id="fromAccount" required>
                <option value="">Select account</option>
                <option value="miles-plus">Miles+</option>
                <option value="bdo">BDO</option>
                <option value="chinabank">Chinabank</option>
                <option value="paul-miles-plus">Paul Miles+</option>
                <option value="paul-reserve">Paul Reserve</option>
                <option value="gcash">Gcash</option>
                <option value="cash">Cash</option>
              </select>
            </div>
            <div class="form-group">
              <label>To Account</label>
              <select id="toAccount" required>
                <option value="">Select account</option>
                <option value="miles-plus">Miles+</option>
                <option value="bdo">BDO</option>
                <option value="chinabank">Chinabank</option>
                <option value="paul-miles-plus">Paul Miles+</option>
                <option value="paul-reserve">Paul Reserve</option>
                <option value="gcash">Gcash</option>
                <option value="cash">Cash</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Notes (Optional)</label>
            <textarea id="transferRemarks" rows="2" placeholder="e.g., Transferred for savings..."></textarea>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn btn-primary">Record Transfer</button>
            <button type="button" class="btn btn-secondary" onclick="document.querySelector('#transfer form').reset();">Clear</button>
          </div>
        </form>
      </div>

      <div class="card" style="margin-top: 16px;">
        <h3 style="margin-bottom: 12px;">Recent Transfers</h3>
        <div id="transfersList"></div>
      </div>
    </div>

    <!-- Categories Tab -->
    <div id="categories" class="tab-content">
      <div class="card">
        <h2 style="margin-bottom: 16px;">Manage Categories</h2>
        <div class="form-group">
          <label>Add New Category</label>
          <div style="display: grid; grid-template-columns: 1fr 100px; gap: 8px;">
            <input type="text" id="catName" placeholder="e.g., Gym, Books">
            <input type="text" id="catEmoji" placeholder="😀" maxlength="2" value="📌">
          </div>
          <button class="btn btn-primary" onclick="addCategory()" style="margin-top: 8px; width: 100%;">Add</button>
        </div>
        <div id="categoriesList"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let splits = [];

    function setType(type) {
      document.getElementById('entryType').value = type;
      document.querySelectorAll('.btn-type').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    function toggleSplit() {
      const container = document.getElementById('splitContainer');
      if (document.getElementById('splitEntry').checked) {
        container.style.display = 'block';
        splits = [];
        addSplit();
      } else {
        container.style.display = 'none';
        splits = [];
        document.getElementById('splitsList').innerHTML = '';
      }
    }

    function addSplit() {
      const splitId = Date.now();
      splits.push({ id: splitId, category: 'other', percent: 0 });
      renderSplits();
    }

    function removeSplit(id) {
      splits = splits.filter(s => s.id !== id);
      renderSplits();
    }

    function renderSplits() {
      const list = document.getElementById('splitsList');
      list.innerHTML = splits.map(split => `
        <div style="display: grid; grid-template-columns: 1fr 100px auto; gap: 8px; margin-bottom: 8px; align-items: end;">
          <select onchange="updateSplit(${split.id}, 'category', this.value)">
            <option value="groceries" ${split.category === 'groceries' ? 'selected' : ''}>🛒 Groceries</option>
            <option value="transport" ${split.category === 'transport' ? 'selected' : ''}>🚗 Transport</option>
            <option value="dining" ${split.category === 'dining' ? 'selected' : ''}>🍽️ Dining</option>
            <option value="shopping" ${split.category === 'shopping' ? 'selected' : ''}>🛍️ Shopping</option>
            <option value="utilities" ${split.category === 'utilities' ? 'selected' : ''}>💡 Utilities</option>
            <option value="entertainment" ${split.category === 'entertainment' ? 'selected' : ''}>🎬 Entertainment</option>
            <option value="health" ${split.category === 'health' ? 'selected' : ''}>💊 Health</option>
            <option value="other" ${split.category === 'other' ? 'selected' : ''}>📝 Other</option>
          </select>
          <input type="number" placeholder="%" min="0" max="100" value="${split.percent}" onchange="updateSplit(${split.id}, 'percent', this.value)">
          <button type="button" class="btn-danger" onclick="removeSplit(${split.id})">❌</button>
        </div>
      `).join('');
    }

    function updateSplit(id, field, value) {
      const split = splits.find(s => s.id === id);
      if (split) {
        split[field] = field === 'percent' ? parseFloat(value) : value;
      }
    }

    const paymentLabels = {
      'gcash': 'Gcash',
      'miles-plus': 'Miles+',
      'bdo': 'BDO',
      'chinabank': 'Chinabank',
      'paul-miles-plus': 'Paul Miles+',
      'paul-reserve': 'Paul Reserve',
      'shell': 'Shell',
      'rewards': 'Rewards',
      'cashback-mc': 'Cashback MC',
      'mastercard': 'Mastercard',
      'unionbank': 'Unionbank',
      'bpi': 'BPI',
      'cash': 'Cash'
    };

    const categoryLabels = {
      'groceries': '🛒 Groceries',
      'transport': '🚗 Transport',
      'dining': '🍽️ Dining',
      'shopping': '🛍️ Shopping',
      'utilities': '💡 Utilities',
      'entertainment': '🎬 Entertainment',
      'health': '💊 Health',
      'salary': '💼 Salary',
      'bonus': '🎁 Bonus/Gift',
      'other': '📝 Other'
    };

    function loadData() {
      return JSON.parse(localStorage.getItem('expenses')) || [];
    }

    function saveData(data) {
      localStorage.setItem('expenses', JSON.stringify(data));
      updateView();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function setToday() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;
    }

    function resetForm() {
      document.getElementById('expenseForm').reset();
      setToday();
    }

    function handleSubmit(e) {
      e.preventDefault();
      const date = document.getElementById('date').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const store = document.getElementById('store').value;
      const category = document.getElementById('category').value;
      const payment = document.getElementById('payment').value;
      const remarks = document.getElementById('remarks').value;
      const type = document.getElementById('entryType').value;

      if (!store || !amount) {
        showToast('Please fill in all fields');
        return;
      }

      const expenses = loadData();

      if (document.getElementById('splitEntry').checked) {
        // Split entry
        const totalPercent = splits.reduce((sum, s) => sum + (s.percent || 0), 0);
        if (totalPercent !== 100) {
          showToast(`Split percentages must equal 100% (currently ${totalPercent}%)`);
          return;
        }
        
        splits.forEach(split => {
          expenses.push({
            id: Date.now() + Math.random(),
            date,
            store,
            amount: (amount * split.percent / 100).toFixed(2),
            category: split.category,
            payment,
            remarks: `${remarks} (${split.percent}% of split)`,
            type
          });
        });
      } else {
        // Regular entry
        expenses.push({
          id: Date.now(),
          date,
          store,
          amount,
          category,
          payment,
          remarks,
          type
        });
      }

      saveData(expenses);
      resetForm();
      switchTab('view');
      showToast('Entry added!');
    }

    function deleteExpense(id) {
      if (confirm('Delete this expense?')) {
        const expenses = loadData();
        const filtered = expenses.filter(e => e.id !== id);
        saveData(filtered);
        showToast('Deleted!');
      }
    }

    function handleTransfer(e) {
      e.preventDefault();
      const date = document.getElementById('transferDate').value;
      const amount = parseFloat(document.getElementById('transferAmount').value);
      const fromAccount = document.getElementById('fromAccount').value;
      const toAccount = document.getElementById('toAccount').value;
      const remarks = document.getElementById('transferRemarks').value;

      if (!fromAccount || !toAccount || !amount) {
        showToast('Please fill in all fields');
        return;
      }

      if (fromAccount === toAccount) {
        showToast('From and To accounts must be different');
        return;
      }

      const transfers = JSON.parse(localStorage.getItem('transfers')) || [];
      transfers.push({
        id: Date.now(),
        date,
        from: fromAccount,
        to: toAccount,
        amount,
        remarks
      });

      localStorage.setItem('transfers', JSON.stringify(transfers));
      e.target.reset();
      document.getElementById('transferDate').value = new Date().toISOString().split('T')[0];
      showToast('Transfer recorded!');
      updateTransfersView();
    }

    function updateTransfersView() {
      const transfers = JSON.parse(localStorage.getItem('transfers')) || [];
      const html = transfers.sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 10).map(t => `
        <div style="background: #f1f5f9; padding: 12px; border-radius: 6px; margin-bottom: 8px;">
          <div style="display: flex; justify-content: space-between;">
            <span><strong>${paymentLabels[t.from] || t.from}</strong> → <strong>${paymentLabels[t.to] || t.to}</strong></span>
            <span>₱${parseFloat(t.amount).toFixed(2)}</span>
          </div>
          <div style="font-size: 12px; color: #64748b; margin-top: 4px;">
            ${t.date} ${t.remarks ? '• ' + t.remarks : ''}
          </div>
        </div>
      `).join('');

      document.getElementById('transfersList').innerHTML = html || '<p style="color: #64748b;">No transfers yet</p>';
    }

    function updateView() {
      const expenses = loadData();
      const count = expenses.length;
      document.querySelector('[onclick="switchTab(\'view\')"]').textContent = `View (${count})`;

      if (count === 0) {
        document.getElementById('empty-view').style.display = 'block';
        document.getElementById('summary').style.display = 'none';
        document.getElementById('table-container').innerHTML = '';
        return;
      }

      document.getElementById('empty-view').style.display = 'none';
      document.getElementById('summary').style.display = 'grid';

      const totalExpense = expenses.filter(e => e.type !== 'income').reduce((s, e) => s + parseFloat(e.amount), 0);
      const totalIncome = expenses.filter(e => e.type === 'income').reduce((s, e) => s + parseFloat(e.amount), 0);
      const net = totalIncome - totalExpense;

      document.getElementById('summary').innerHTML = `
        <div class="summary-card">
          <div class="summary-label">Expenses</div>
          <div class="summary-value" style="color: #dc2626;">₱${totalExpense.toFixed(2)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Income</div>
          <div class="summary-value" style="color: #16a34a;">+₱${totalIncome.toFixed(2)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Net</div>
          <div class="summary-value" style="color: ${net >= 0 ? '#16a34a' : '#dc2626'};">₱${net.toFixed(2)}</div>
        </div>
      `;

      const rows = expenses.sort((a, b) => new Date(b.date) - new Date(a.date)).map(e => `
        <tr style="background: ${e.type === 'income' ? '#f0fdf4' : '#fef8f8'};">
          <td>${e.date}</td>
          <td><strong>${e.store}</strong> ${e.type === 'income' ? '📥' : '📤'}</td>
          <td>${categoryLabels[e.category] || e.category}</td>
          <td><strong style="color: ${e.type === 'income' ? '#16a34a' : '#dc2626'};">
            ${e.type === 'income' ? '+' : '−'}₱${Math.abs(parseFloat(e.amount)).toFixed(2)}
          </strong></td>
          <td>${paymentLabels[e.payment] || e.payment}</td>
          <td>${e.remarks || '—'}</td>
          <td style="text-align: center;">
            <button class="btn-danger" onclick="deleteExpense(${e.id})">🗑️</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('table-container').innerHTML = `
        <div class="card" style="overflow-x: auto;">
          <table class="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Store</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Payment</th>
                <th>Notes</th>
                <th></th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
      
      if (tab === 'view') updateView();
      if (tab === 'categories') updateCategories();
      if (tab === 'transfer') updateTransfersView();
      if (tab === 'add') {
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
      }
    }

    function addCategory() {
      const name = document.getElementById('catName').value.trim();
      const emoji = document.getElementById('catEmoji').value;

      if (!name) {
        showToast('Enter category name');
        return;
      }

      const key = name.toLowerCase().replace(/\s+/g, '-');
      categoryLabels[key] = emoji + ' ' + name;
      document.getElementById('catName').value = '';
      document.getElementById('catEmoji').value = '📌';
      updateCategories();
      showToast('Category added!');
    }

    function updateCategories() {
      const html = Object.entries(categoryLabels).map(([k, v]) => `
        <div class="card" style="margin-bottom: 8px; padding: 12px;">
          <span>${v}</span>
        </div>
      `).join('');
      document.getElementById('categoriesList').innerHTML = html;
    }

    setToday();
    document.getElementById('transferDate').value = new Date().toISOString().split('T')[0];
    updateView();
    updateTransfersView();
  </script>
</body>
</html>
